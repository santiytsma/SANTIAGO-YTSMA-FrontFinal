<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compositores Clásicos</title>
    <link rel="stylesheet" href="styles.css">
    <script src="main.js" defer></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header">
        <input type="text" id="buscarAutor" placeholder="Ingresá un nombre">
        <select name="Período" id="filtroPeriodo">
            <option value="">Todos los períodos</option>
            <option value="Baroque">Baroque</option>
            <option value="Classical">Classical</option>
            <option value="Early Romantic">Early Romantic</option>
            <option value="Romantic">Romantic</option>
            <option value="Late Romantic">Late Romantic</option>
            <option value="Century">20th century</option>
        </select>
    </div>
    <section class="contenedor" id="contenedor">
    
        
    </section>
    <div id="popup" class="popup">
          <div class="popupCua" id="popupCua">
            <h3 class="tituloObra">Principales obras:</h3>
            <ul id="obrasPop"></ul>
            <button id="cerrar">Cerrar</button>
          </div>
        </div>
</body>
</html>
